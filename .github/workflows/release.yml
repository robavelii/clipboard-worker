# Standalone `clipsync` binaries (decisions §29), built on each platform's
# own runner so every one of them is run once before it ships.
#
# A pull request that touches the agent builds and smoke-tests all five. A
# tag such as v0.2.0 does the same, then publishes them to a GitHub Release
# with a SHA256SUMS file.

name: Release

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "apps/agent/**"
      - "apps/server/**"
      - "packages/**"
      - "scripts/build-id.mjs"
      - "scripts/install.sh"
      - "scripts/install.ps1"
      - "package-lock.json"
      - ".github/workflows/release.yml"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux-x64, runner: ubuntu-24.04 }
          - { target: linux-arm64, runner: ubuntu-24.04-arm }
          - { target: darwin-arm64, runner: macos-15 }
          - { target: darwin-x64, runner: macos-15-intel }
          - { target: windows-x64, runner: windows-2025 }
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    env:
      # Releases carry their tag as the build id; other runs, the commit.
      CLIPSYNC_BUILD_ID: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Self-update, for real (decisions §34): a v0.0.1 build replaces itself,
      # while it runs, with a v0.0.2 build served by a local stand-in for
      # GitHub releases. On Windows that is the rename-aside path. The build
      # the job publishes comes after, in the next step.
      - name: Update itself from a release
        env:
          MSYS_NO_PATHCONV: "1"
        run: |
          t=${{ matrix.target }}
          exe=clipsync; [ "$RUNNER_OS" = Windows ] && exe=clipsync.exe
          rel="$RUNNER_TEMP/rel"; old="$RUNNER_TEMP/old"
          mkdir -p "$rel" "$old"
          CLIPSYNC_BUILD_ID=v0.0.2 npm run build:binary
          gzip -9 -c "apps/agent/dist/bin/$t/$exe" > "$rel/clipsync-$t.gz"
          (cd "$rel" && if command -v sha256sum >/dev/null; then sha256sum clipsync-*; else shasum -a 256 clipsync-*; fi > SHA256SUMS)
          CLIPSYNC_BUILD_ID=v0.0.1 npm run build:binary
          cp "apps/agent/dist/bin/$t/$exe" "$old/$exe"
          node apps/agent/test/fake-releases.mjs "$rel" v0.0.2 8766 &
          for i in $(seq 1 30); do curl -s -o /dev/null http://127.0.0.1:8766/releases/latest && break; sleep 1; done
          # Running while it is replaced, as under a service: it waits at a prompt.
          (sleep 90 | "$old/$exe" login --url http://127.0.0.1:9 >/dev/null 2>&1) &
          sleep 3
          CLIPSYNC_RELEASES=http://127.0.0.1:8766/releases "$old/$exe" update | tee update.txt
          grep -q "Updated v0.0.1 -> v0.0.2" update.txt
          "$old/$exe" --version | grep -q "^clipsync v0.0.2"
      - run: npm run build:binary
      - name: Smoke test
        run: |
          bin=apps/agent/dist/bin/${{ matrix.target }}/clipsync
          [ -f "$bin.exe" ] && bin="$bin.exe"
          "$bin" --version
          "$bin" --version | grep -q '^clipsync ' || { echo "unexpected --version output"; exit 1; }
          # With no config it must say so and exit cleanly, having loaded
          # every module the CLI imports.
          XDG_CONFIG_HOME="$RUNNER_TEMP/empty" "$bin" status | tee status.txt
          grep -q "Not configured" status.txt
          # The server it carries (decisions §40): SQLite and the built-in web
          # UI, on this platform's own Node.
          "$bin" serve --data "$RUNNER_TEMP/serve-data" --listen 127.0.0.1:8799 > serve.txt 2>&1 &
          pid=$!
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8799/api/health && break; sleep 1; done
          curl -sfI http://127.0.0.1:8799/ | grep -i '^content-security-policy:'
          kill "$pid" 2>/dev/null || true
          cat serve.txt
          grep -q '"web":"built in"' serve.txt
          if grep -q ExperimentalWarning serve.txt; then echo "SQLite's warning reached the log"; exit 1; fi
      # Clipboard change events on each platform's own clipboard (decisions
      # §36): `clipsync watch` must report copies made by the platform's own
      # tools. Linux has no desktop here, so it gets an Xvfb display.
      - name: Clipboard change events
        run: |
          bin=apps/agent/dist/bin/${{ matrix.target }}/clipsync
          [ -f "$bin.exe" ] && bin="$bin.exe"
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get install -y --no-install-recommends xclip xvfb >/dev/null
            Xvfb :99 -nolisten tcp >/dev/null 2>&1 &
            export DISPLAY=:99 WAYLAND_DISPLAY=
            for i in $(seq 1 50); do [ -e /tmp/.X11-unix/X99 ] && break; sleep 0.2; done
          fi
          copy() {
            case "$RUNNER_OS" in
              Linux) printf %s "$1" | xclip -selection clipboard -i ;;
              macOS) printf %s "$1" | pbcopy ;;
              Windows) powershell.exe -NoProfile -Command "Set-Clipboard -Value '$1'" ;;
            esac
          }
          "$bin" watch > watch.txt 2>&1 &
          pid=$!
          for i in $(seq 1 120); do grep -q "watching\|error" watch.txt && break; sleep 0.5; done
          for text in one two three; do copy "$text"; sleep 1; done
          kill $pid 2>/dev/null || true
          cat watch.txt
          [ "$(grep -c 'clipboard changed' watch.txt)" -ge 3 ]
      # The agent's clipboard backends against this platform's real clipboard:
      # text, a received file put there as a file, a change event (decisions
      # §37). Linux uses the Xvfb display the step above started.
      - name: Native clipboard
        run: |
          if [ "$RUNNER_OS" = Linux ]; then export DISPLAY=:99 WAYLAND_DISPLAY=; fi
          npm test -w @clipsync/agent -- test/native-clipboard.test.ts
      # An archive for people and installers, and the bare binary gzipped for
      # `clipsync update`, which needs no archive reader.
      - name: Archive
        run: |
          cd apps/agent/dist/bin/${{ matrix.target }}
          if [ "${{ matrix.target }}" = windows-x64 ]; then
            7z a -tzip "$GITHUB_WORKSPACE/clipsync-${{ matrix.target }}.zip" clipsync.exe
            gzip -9 -c clipsync.exe > "$GITHUB_WORKSPACE/clipsync-${{ matrix.target }}.gz"
          else
            tar -czf "$GITHUB_WORKSPACE/clipsync-${{ matrix.target }}.tar.gz" clipsync
            gzip -9 -c clipsync > "$GITHUB_WORKSPACE/clipsync-${{ matrix.target }}.gz"
          fi
      # The one-command installer, then a real service, where the runner has
      # a desktop session to install into: Task Scheduler on Windows, launchd
      # on macOS. The installer fetches this job's own archive from a local
      # server standing in for the release, and checks it against a
      # SHA256SUMS made here. The runner is not enrolled (CLIPSYNC_LINK=0), so
      # the agent the service starts says so in its log and stops for good,
      # which proves the whole chain ran.
      - name: Install with the installer, then remove
        if: runner.os != 'Linux'
        env:
          MSYS_NO_PATHCONV: "1"
          CLIPSYNC_LINK: "0"
          CLIPSYNC_URL: https://clipsync.invalid
          CLIPSYNC_DOWNLOAD_BASE: http://127.0.0.1:8765
        run: |
          mkdir -p release && cp clipsync-${{ matrix.target }}.* release/
          (cd release && if command -v sha256sum >/dev/null; then sha256sum clipsync-*; else shasum -a 256 clipsync-*; fi > SHA256SUMS)
          py=python3; command -v python3 >/dev/null || py=python
          "$py" -m http.server 8765 --bind 127.0.0.1 --directory release >/dev/null 2>&1 &
          # Wait for it to answer: a first Python start on a fresh runner can
          # take longer than any fixed pause.
          for i in $(seq 1 30); do curl -sf -o /dev/null http://127.0.0.1:8765/SHA256SUMS && break; sleep 1; done
          if [ "$RUNNER_OS" = Windows ]; then
            powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/install.ps1
          else
            sh scripts/install.sh
          fi
          sleep 10
          if [ "$RUNNER_OS" = Windows ]; then
            schtasks /Query /TN ClipSync /FO LIST
            log="$(cygpath "$LOCALAPPDATA")/clipsync/clipsync.log"
            installed="$(cygpath "$LOCALAPPDATA")/Programs/clipsync/clipsync.exe"
            powershell.exe -NoProfile -Command "[Environment]::GetEnvironmentVariable('Path','User')" | grep -qi 'Programs\\clipsync'
          else
            launchctl print "gui/$(id -u)/clipsync.agent" | head -20
            log="$HOME/Library/Logs/clipsync.log"
            installed="$HOME/.local/bin/clipsync"
          fi
          "$installed" --version
          cat "$log"
          grep -q "not enrolled" "$log"
          "$installed" uninstall
          if [ "$RUNNER_OS" = Windows ]; then
            ! schtasks /Query /TN ClipSync 2>/dev/null
          else
            ! launchctl print "gui/$(id -u)/clipsync.agent" >/dev/null 2>&1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: clipsync-${{ matrix.target }}
          path: clipsync-${{ matrix.target }}.*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish the release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: |
          sha256sum clipsync-* > SHA256SUMS
          cat SHA256SUMS
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
