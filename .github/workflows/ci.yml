# Typecheck and unit tests on every push and PR, plus the end-to-end suite
# against a local Worker and against the Node server -- the same checks a
# contributor runs by hand.
# A push to main that passes both then migrates the production database and
# deploys the Worker (docs/decisions.md §30), and deploys the Node server to
# the staging host (§39).

name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push supersedes a PR's run. On main, runs queue instead: cancelling
# one between its migration and its deploy would leave them out of step.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  WRANGLER_SEND_METRICS: "false"

jobs:
  check:
    name: Typecheck and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The X11 change-event tests run against Xvfb, and copy with xclip.
      - run: sudo apt-get install -y --no-install-recommends xclip xvfb
      - run: npm run typecheck
      - run: npm test

  e2e:
    name: End-to-end against a local Worker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Local-only secret; must match the suite's CLIPSYNC_ADMIN_SECRET default.
      - run: echo 'ADMIN_SECRET="local-dev-admin-secret"' > apps/worker/.dev.vars
      - run: npm run db:migrate:local
      - name: Start the Worker
        run: nohup npm run dev > wrangler.log 2>&1 &
      - name: Wait for it to answer
        run: |
          for i in $(seq 1 90); do
            curl -sf http://127.0.0.1:8787/api/health && exit 0
            sleep 2
          done
          echo "Worker did not come up"; cat wrangler.log; exit 1
      - run: npm run e2e
      # The standalone binary, against the same Worker: enrol, send a file,
      # read it back. Catches what bundling as a single executable breaks
      # (a module it cannot load, WebCrypto, fetch) before a release does.
      # The account and passphrase are the ones the e2e suite leaves behind.
      - name: Standalone binary against the local Worker
        run: |
          npm run build:binary
          bin=apps/agent/dist/bin/linux-x64/clipsync
          export XDG_CONFIG_HOME="$RUNNER_TEMP/binary-config"
          printf '%s\n%s\n%s\n' local-dev-admin-secret "correct horse battery staple" "correct horse battery staple" \
            | "$bin" login --url http://127.0.0.1:8787 --name ci-binary
          echo "sent by the standalone binary" > "$RUNNER_TEMP/note.txt"
          "$bin" send "$RUNNER_TEMP/note.txt"
          "$bin" history -n 1 | tee history.txt
          grep -q "note.txt" history.txt
          "$bin" logout
      - name: Worker log
        if: failure()
        run: cat wrangler.log

  # The same suite against the Node server (apps/server, decisions §38): the
  # Worker's app on node:sqlite and a directory of files, with no wrangler
  # in the loop. A route that relies on something only Cloudflare provides
  # fails here.
  e2e-node:
    name: End-to-end against the Node server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:server
      - name: Start the server
        run: |
          CLIPSYNC_ADMIN_SECRET=local-dev-admin-secret \
            nohup node apps/server/dist/clipsync-server.mjs --data "$RUNNER_TEMP/clipsync-data" > server.log 2>&1 &
      - name: Wait for it to answer
        run: |
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8787/api/health && exit 0
            sleep 1
          done
          echo "server did not come up"; cat server.log; exit 1
      - name: The web UI is served with its CSP
        run: curl -sfI http://127.0.0.1:8787/ | grep -i '^content-security-policy:'
      - run: npm run e2e
      # Twice: the suite must hold against a database it has already used,
      # as it does against wrangler's.
      - run: npm run e2e
      - name: Server log
        if: failure()
        run: cat server.log

  deploy:
    name: Deploy to Cloudflare
    needs: [check, e2e, e2e-node]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://clip.rfh.et
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check for credentials
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Set the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets to deploy from CI (README, Deploy)."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Before the deploy: migrations only ever add, so the Worker that is
      # still live keeps working against the new schema until it is replaced.
      - name: Apply database migrations
        run: npm run db:migrate
      - name: Build and deploy the Worker
        run: npm run deploy
      # A zone's bot protection may answer GitHub's runners with a challenge
      # instead of the Worker. That proves the edge is up but not the
      # Worker, so it passes with a warning; anything else is printed.
      - name: Check it answers
        run: |
          for i in $(seq 1 10); do
            code=$(curl -sS -o body.txt -D headers.txt -w '%{http_code}' https://clip.rfh.et/api/health || true)
            if [ "$code" = 200 ] && grep -q '"ok":true' body.txt; then cat body.txt; exit 0; fi
            if grep -qi '^cf-mitigated: *challenge' headers.txt 2>/dev/null; then
              echo "::warning::clip.rfh.et answered with a Cloudflare challenge (HTTP $code): the zone's bot protection screens GitHub's runners, so the Worker could not be checked from here."
              exit 0
            fi
            echo "attempt $i: HTTP $code"
            sleep 3
          done
          echo "::error::clip.rfh.et did not answer after the deploy (last: HTTP $code)"
          head -c 600 body.txt 2>/dev/null
          exit 1

  # The Node server to the staging host (deploy/server, decisions §39): the
  # build e2e-node checked, installed by clipsync-deploy, which rolls back if
  # it does not answer. Beside the Worker's deploy, not before it: staging
  # runs a different target, so neither should hold the other up.
  # The key may only upload a file and run clipsync-deploy. The secrets are
  # given to the steps that use them, never to npm's install scripts.
  deploy-staging:
    name: Deploy to staging
    needs: [check, e2e, e2e-node]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://staging.clip.rfh.et
    steps:
      - name: Check for credentials
        env:
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_KNOWN_HOSTS: ${{ secrets.STAGING_KNOWN_HOSTS }}
        run: |
          if [ -z "$STAGING_SSH_KEY" ] || [ -z "$STAGING_HOST" ] || [ -z "$STAGING_KNOWN_HOSTS" ]; then
            echo "::error::Set the STAGING_SSH_KEY, STAGING_HOST and STAGING_KNOWN_HOSTS repository secrets to deploy to staging (README, Staging)."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:server
      - name: Pack the build
        run: tar -czf "$RUNNER_TEMP/clipsync-server.tgz" -C apps/server/dist .
      - name: Upload and switch to it
        env:
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_KNOWN_HOSTS: ${{ secrets.STAGING_KNOWN_HOSTS }}
        run: |
          key="$RUNNER_TEMP/staging-key"
          (umask 077 && printf '%s\n' "$STAGING_SSH_KEY" > "$key")
          printf '%s\n' "$STAGING_KNOWN_HOSTS" > "$RUNNER_TEMP/known_hosts"
          set -- -i "$key" -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/known_hosts"
          scp "$@" "$RUNNER_TEMP/clipsync-server.tgz" "clipsync-deploy@$STAGING_HOST:release.tgz"
          ssh "$@" "clipsync-deploy@$STAGING_HOST" 'sudo /usr/local/sbin/clipsync-deploy "$HOME/release.tgz"'
          rm -f "$key"
      - name: Check it answers
        run: |
          curl -fsS --retry 5 --retry-all-errors https://staging.clip.rfh.et/api/health | tee body.txt
          grep -q '"ok":true' body.txt
