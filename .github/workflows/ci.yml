# Typecheck and unit tests on every push and PR, plus the end-to-end suite
# against a local Worker -- the same checks a contributor runs by hand.
# A push to main that passes both then migrates the production database and
# deploys the Worker (docs/decisions.md §30).

name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push supersedes a PR's run. On main, runs queue instead: cancelling
# one between its migration and its deploy would leave them out of step.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  WRANGLER_SEND_METRICS: "false"

jobs:
  check:
    name: Typecheck and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  e2e:
    name: End-to-end against a local Worker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Local-only secret; must match the suite's CLIPSYNC_ADMIN_SECRET default.
      - run: echo 'ADMIN_SECRET="local-dev-admin-secret"' > apps/worker/.dev.vars
      - run: npm run db:migrate:local
      - name: Start the Worker
        run: nohup npm run dev > wrangler.log 2>&1 &
      - name: Wait for it to answer
        run: |
          for i in $(seq 1 90); do
            curl -sf http://127.0.0.1:8787/api/health && exit 0
            sleep 2
          done
          echo "Worker did not come up"; cat wrangler.log; exit 1
      - run: npm run e2e
      # The standalone binary, against the same Worker: enrol, send a file,
      # read it back. Catches what bundling as a single executable breaks
      # (a module it cannot load, WebCrypto, fetch) before a release does.
      # The account and passphrase are the ones the e2e suite leaves behind.
      - name: Standalone binary against the local Worker
        run: |
          npm run build:binary
          bin=apps/agent/dist/bin/linux-x64/clipsync
          export XDG_CONFIG_HOME="$RUNNER_TEMP/binary-config"
          printf '%s\n%s\n%s\n' local-dev-admin-secret "correct horse battery staple" "correct horse battery staple" \
            | "$bin" login --url http://127.0.0.1:8787 --name ci-binary
          echo "sent by the standalone binary" > "$RUNNER_TEMP/note.txt"
          "$bin" send "$RUNNER_TEMP/note.txt"
          "$bin" history -n 1 | tee history.txt
          grep -q "note.txt" history.txt
          "$bin" logout
      - name: Worker log
        if: failure()
        run: cat wrangler.log

  deploy:
    name: Deploy to Cloudflare
    needs: [check, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://clip.rfh.et
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check for credentials
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Set the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets to deploy from CI (README, Deploy)."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Before the deploy: migrations only ever add, so the Worker that is
      # still live keeps working against the new schema until it is replaced.
      - name: Apply database migrations
        run: npm run db:migrate
      - name: Build and deploy the Worker
        run: npm run deploy
      - name: Check it answers
        run: |
          for i in $(seq 1 10); do
            curl -sf https://clip.rfh.et/api/health && exit 0
            sleep 3
          done
          echo "::error::clip.rfh.et did not answer after the deploy"; exit 1
